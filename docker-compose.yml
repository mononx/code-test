services:
  mysql:
    image: mysql:8.0
    container_name: code-test_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: api_db
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: code-test_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data: